    <circle cx="764" cy="156" r="3.5" fill="#AEB6C2"/>
    <path d="M757 168 Q757 160 764 160 Q771 160 771 168"/>
    <path d="M764 191 Q757 191 757 200 H771 Q771 191 764 191 Z"/>
    <path d="M760 191 Q760 185 764 185 Q768 185 768 191"/>
    <path d="M764 227 L772 230 V236
