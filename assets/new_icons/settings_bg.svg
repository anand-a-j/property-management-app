    <circle cx="219" cy="275" r="8"/>
    <circle cx="232" cy="272" r="11"/>
    <circle cx="244" cy="278" r="8"/>
    <ellipse cx="637" cy="282" rx="27" ry="8"/>
    <circle cx="625" cy="275" r="8"/>
    <circle cx="638" cy="271" r="11"/>
    <circle cx="650" cy="278" r="8"/>
