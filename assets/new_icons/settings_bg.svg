  <!-- Windows -->
  <g fill="#E7EBF0" stroke="#D9DEE6">
    <rect x="361" y="164" width="25" height="17" rx="2"/>
    <rect x="397" y="175" width="25" height="17" rx="2"/>
    <rect x="463" y="174" width="25" height="17" rx="2"/>
    <rect x="500" y="163" width="25" height="17" rx="2"/>
    <rect x="361" y="197" width="25" height="17" rx="2"/>
    <rect x="397" y="208" width="25" height="17" rx="2"/>
    <rect x="463" y="207" width="25" height="17" rx="2"/>
    <rect x="500" y="196" width="25" height="17" rx="2"/>
    <rect x="361" y="230" width="25" height="17" rx="2"/>
    <rect x="397" y="241" width="25" height="17" rx="2"/>
    <rect x="463" y="240" width="25" height="17" rx="2"/>
    <rect x="500" y="229" width="25" height="17" rx="2"/>
