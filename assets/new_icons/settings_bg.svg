      Q228 113 232 130 Z"/>
    <path d="M905 88 Q909 71 928 77
      Q940 49 962 74 Q981 63 993 86 Z"/>
    <path d="M1020 133 Q1027 115 1046 122
      Q1060 94 1081 119 Q1104 111 1116 135 Z"/>
  </g>

  <!-- Distant city -->
  <g fill="#F5F6F8">
    <path d="M25 260 V210 H53 V260
      M65 260 V185 H94 V260
      M103 260 V224 H130 V260
      M146 260 V198 H174 V260
      M190 260 V225 H218 V260
      M244 260 V207 H268 V260
      M285 260 V228 H314 V260
      M337 260 V190 H363 V260
      M375 260 V218 H408 V260
      M810 260 V210 H839 V260
      M845 260 V187 H871 V260
      M1080 260 V210 H1109 V260
      M1120 260 V228 H1150 V260
