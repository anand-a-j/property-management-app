  <g>
    <rect x="748" y="146" width="132" height="29"
          rx="7" fill="#F6F7F9"/>
    <rect x="748" y="183" width="132" height="29"
          rx="7" fill="#F6F7F9"/>
    <rect x="748" y="220" width="132" height="29"
          rx="7" fill="#F6F7F9"/>
    <rect x="748" y="257" width="132" height="22"
