name: naseem
description: >
  Naseem - A premium property management platform for modern residential communities.
  A simple, elegant space to manage properties, residents, leases, payments,
  maintenance, and visitors with ease.

publish_to: "none" # Prevent accidental publishing to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  go_router: ^17.5.0
  flutter_svg: ^2.2.3

  hive_ce: ^2.11.3
  hive_ce_flutter: ^2.3.1
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  uuid: ^4.5.1
  path_provider: ^2.1.5
  intl: ^0.20.2
  timezone: ^0.11.1
  hive_flutter: ^1.1.0
  file_picker: ^13.1.0
  flutter_timezone: ^5.0.1
  url_launcher: ^6.3.2
  carousel_slider: ^5.1.1
  package_info_plus: ^10.2.1
  # NEW--------------------------------------------------
  supabase_flutter: ^2.12.2
  image_picker: ^1.2.1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  flutter_colorpicker: ^1.1.0
  http: ^1.6.0
  flutter_bloc: ^9.1.1
  bloc: ^9.2.1
  flutter_dotenv: ^6.0.1
  equatable: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_ce_generator: ^1.9.2
  build_runner: ^2.5.4
  freezed: ^3.1.0
  json_serializable: ^6.9.5

flutter:
  uses-material-design: true
  assets:
    - assets/new_icons/
    - assets/image/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/inter_light.ttf
          weight: 300
        - asset: assets/fonts/inter_regular.ttf
          weight: 400
        - asset: assets/fonts/inter_medium.ttf
          weight: 500
        - asset: assets/fonts/inter_semibold.ttf
          weight: 600
        - asset: assets/fonts/inter_bold.ttf
          weight: 700
